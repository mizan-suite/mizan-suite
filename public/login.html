<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mizan Suite - Login</title>
  <script>try{var t=localStorage.getItem('mizan_theme');document.documentElement.setAttribute('data-theme',t||'blue');var d=localStorage.getItem('mizan_dark');if(d==='true')document.documentElement.classList.add('dark-mode');var l=localStorage.getItem('mizan_lang');if(l==='ar'||l==='fr'){document.documentElement.lang=l;}if(l==='ar')document.documentElement.dir='rtl';}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dark-mode.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="rtl.css">
</head>
<body class="login-body" data-i18n-title="login.title">

  <div class="login-card">
    <div class="logo login-logo">Mizan Suite</div>
    <p class="login-subtitle" data-i18n="login.subtitle">Enter your account name and PIN to continue</p>
    <input type="text" id="name-input" data-i18n="login.namePlaceholder" placeholder="Account name" autocomplete="off" autofocus>
    <input type="password" id="pin-input" data-i18n="login.pinPlaceholder" placeholder="PIN" inputmode="numeric" autocomplete="off">
    <button id="login-btn" class="btn login-btn" data-i18n="login.button">Log in</button>
    <p id="login-message"></p>
  </div>

  <script src="i18n.js"></script>
  <script src="theme.js"></script>
  <script src="login.js"></script>
</body>
</html>
