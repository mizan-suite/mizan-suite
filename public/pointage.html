<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mizan Suite - Pointage</title>
  <script>try{var t=localStorage.getItem('mizan_theme');if(t)document.documentElement.setAttribute('data-theme',t);var d=localStorage.getItem('mizan_dark');if(d==='true')document.documentElement.classList.add('dark-mode');var l=localStorage.getItem('mizan_lang');if(l==='ar'||l==='fr'){document.documentElement.lang=l;}if(l==='ar')document.documentElement.dir='rtl';}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dark-mode.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="rtl.css">
</head>
<body data-i18n-title="pointage.title">

  <div id="app-sidebar"></div>

  <main class="container">
    <div class="dashboard-header-row">
      <h1 data-i18n="pointage.title">Pointage</h1>
    </div>

    <!-- Clock in / out -->
    <div class="po-filter">
      <select id="pointage-worker" style="padding:0.4rem 0.6rem; border:1px solid #d8d8d8; border-radius:6px; max-width:220px;"></select>
      <button class="btn" id="clock-btn">Clock in</button>
    </div>

    <!-- Range filter -->
    <div class="po-filter">
      <button class="filter-btn tab-btn active" data-range="today" data-i18n="pointage.today">Today</button>
      <button class="filter-btn tab-btn" data-range="week" data-i18n="pointage.week">This week</button>
      <button class="filter-btn tab-btn" data-range="month" data-i18n="pointage.month">This month</button>
    </div>

    <!-- Per-worker summary -->
    <div id="pointage-summary" style="margin-bottom:1.5rem;"></div>

    <!-- Entries -->
    <div id="pointage-list"></div>
  </main>

  <script src="i18n.js"></script>
  <script src="pointage.js"></script>
  <script src="auth.js"></script>
  <script src="branding.js"></script>
  <script src="support.js"></script>
  <script src="sidebar.js"></script>
  <script src="theme.js"></script>
</body>
</html>
