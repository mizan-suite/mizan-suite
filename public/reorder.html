<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mizan Suite - Reorder Suggestions</title>
  <script>try{var t=localStorage.getItem('mizan_theme');document.documentElement.setAttribute('data-theme',t||'blue');var d=localStorage.getItem('mizan_dark');if(d==='true')document.documentElement.classList.add('dark-mode');var l=localStorage.getItem('mizan_lang');if(l==='ar'||l==='fr'){document.documentElement.lang=l;}if(l==='ar')document.documentElement.dir='rtl';}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dark-mode.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="rtl.css">
</head>
<body data-i18n-title="reorder.title">

  <div id="app-sidebar"></div>

  <main class="container">
    <h1 data-i18n="reorder.title">Reorder Suggestions</h1>
    <p class="hint-text" data-i18n="reorder.hint">Based on sales over the last 30 days - suggests restocking to cover ~30 days of demand. Not a live AI call, just a rule-based estimate from your own sales data.</p>
    <table class="product-table">
      <thead>
        <tr><th data-i18n="reorder.thProduct">Product</th><th data-i18n="reorder.thStock">Current Stock</th><th data-i18n="reorder.thSold">Sold (30d)</th><th data-i18n="reorder.thDaysLeft">Days of Stock Left</th><th data-i18n="reorder.thSuggest">Suggested Reorder</th></tr>
      </thead>
      <tbody id="suggestion-list"></tbody>
    </table>
  </main>

  <script src="i18n.js"></script>
  <script src="reorder.js"></script>
  


  <script src="auth.js"></script>
  <script src="branding.js"></script>
  <script src="support.js"></script>
  <script src="sidebar.js"></script>
  <script src="theme.js"></script>
</body>
</html>
