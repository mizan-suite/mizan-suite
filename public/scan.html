<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mizan Suite - Barcode Scanner</title>
<script>try{var t=localStorage.getItem('mizan_theme');document.documentElement.setAttribute('data-theme',t||'blue');var d=localStorage.getItem('mizan_dark');if(d==='true')document.documentElement.classList.add('dark-mode');var l=localStorage.getItem('mizan_lang');if(l==='ar'||l==='fr'){document.documentElement.lang=l;}if(l==='ar')document.documentElement.dir='rtl';}catch(e){}</script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="rtl.css">
</head>
<body class="scan-body" data-i18n-title="scan.title">
  <div class="scan-screen">
    <header class="scan-header">
      <div class="scan-logo">MZ</div>
      <h1 data-i18n="scan.title">Barcode Scanner</h1>
      <p data-i18n="scan.subtitle">Scan products and they appear instantly in the shop's Inventory.</p>
    </header>

    <div id="scan-pair-box" class="scan-pair-box">
      <label for="scan-code-input" data-i18n="scan.pairingCode">Pairing code</label>
      <input id="scan-code-input" class="scan-code-input" type="number" inputmode="numeric" placeholder="000000" autofocus>
      <button id="scan-start-btn" class="btn btn-primary scan-big-btn" type="button">
        <span data-icon="scan"></span> <span data-i18n="scan.startScanning">Start Scanning</span>
      </button>
    </div>

    <div id="scan-camera-box" class="scan-camera-box" hidden>
      <div class="scan-viewport">
        <video id="scan-video" autoplay playsinline muted></video>
        <div class="scan-corner top-left"></div>
        <div class="scan-corner top-right"></div>
        <div class="scan-corner bottom-left"></div>
        <div class="scan-corner bottom-right"></div>
      </div>
      <div id="scan-status" class="scan-status" data-i18n="scan.openingCamera">Opening camera...</div>
      <div class="scan-actions">
        <button id="scan-snap-btn" class="btn btn-primary scan-big-btn" type="button">
          <span data-icon="scan"></span> <span data-i18n="scan.snapPhoto">Snap a photo</span>
        </button>
        <button id="scan-stop-btn" class="btn btn-danger scan-big-btn" type="button" data-i18n="scan.stopScanning">Stop Scanning</button>
      </div>
    </div>

    <div id="scan-list-box" class="scan-list-box" hidden>
      <h2 data-i18n="scan.scanned">Scanned</h2>
      <p id="scan-count" class="scan-count"></p>
      <ul id="scan-list" class="scan-list"></ul>
    </div>

    <p id="scan-err" class="scan-err" hidden></p>
  </div>
  <script src="icons.js"></script>
  <script src="vendor/zxing.min.js"></script>
  <script src="i18n.js"></script>
  <script src="theme.js"></script>
  <script src="scan.js"></script>
</body>
</html>
