<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mizan Suite - Payroll</title>
  <script>try{var t=localStorage.getItem('mizan_theme');if(t)document.documentElement.setAttribute('data-theme',t);var d=localStorage.getItem('mizan_dark');if(d==='true')document.documentElement.classList.add('dark-mode');var l=localStorage.getItem('mizan_lang');if(l==='ar'||l==='fr'){document.documentElement.lang=l;}if(l==='ar')document.documentElement.dir='rtl';}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dark-mode.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="rtl.css">
</head>
<body data-i18n-title="payroll.title">

  <div id="app-sidebar"></div>

  <main class="container">
    <div class="dashboard-header-row">
      <h1 data-i18n="payroll.title">Payroll</h1>
    </div>

    <!-- Month picker -->
    <div class="po-filter">
      <label style="display:flex; align-items:center; gap:0.5rem; white-space:nowrap;">
        <span data-i18n="payroll.month">Month</span>
        <input type="month" id="payroll-month" style="padding:0.4rem 0.6rem; border:1px solid #d8d8d8; border-radius:6px;">
      </label>
    </div>

    <!-- Summary -->
    <div class="stat-grid" style="margin-bottom:1.5rem;">
      <div class="stat-card">
        <span class="stat-label" data-i18n="payroll.total">Total</span>
        <span class="stat-value" id="payroll-total">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label" data-i18n="payroll.totalUnpaid">Total unpaid</span>
        <span class="stat-value" id="payroll-total-unpaid">-</span>
      </div>
    </div>

    <!-- Payroll table -->
    <div id="payroll-list"></div>
  </main>

  <script src="i18n.js"></script>
  <script src="payroll.js"></script>
  <script src="auth.js"></script>
  <script src="branding.js"></script>
  <script src="support.js"></script>
  <script src="sidebar.js"></script>
  <script src="theme.js"></script>
</body>
</html>
