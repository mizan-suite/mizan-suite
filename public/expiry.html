<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mizan Suite - Expiry</title>
  <script>try{var t=localStorage.getItem('mizan_theme');document.documentElement.setAttribute('data-theme',t||'blue');var d=localStorage.getItem('mizan_dark');if(d==='true')document.documentElement.classList.add('dark-mode');var l=localStorage.getItem('mizan_lang');if(l==='ar'||l==='fr'){document.documentElement.lang=l;}if(l==='ar')document.documentElement.dir='rtl';}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dark-mode.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="rtl.css">
</head>
<body data-i18n-title="expiry.title">

  <div id="app-sidebar"></div>

  <main class="container">
    <div class="dashboard-header-row">
      <h1 data-i18n="expiry.title">Expiry Alerts</h1>
    </div>

    <!-- Summary -->
    <div class="stat-grid" style="margin-bottom:1.5rem;">
      <div class="stat-card">
        <span class="stat-label" data-i18n="expiry.expired">Expired</span>
        <span class="stat-value" style="color:#c0392b;" id="exp-count-expired">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label" data-i18n="expiry.expiring30">Expiring Ã¢â€°Â¤ 30 days</span>
        <span class="stat-value" style="color:#c0392b;" id="exp-count-30">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label" data-i18n="expiry.expiring90">Expiring 31-90 days</span>
        <span class="stat-value" style="color:#8a6d00;" id="exp-count-90">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label" data-i18n="expiry.valid">Valid (no expiry / >90d)</span>
        <span class="stat-value" id="exp-count-ok">-</span>
      </div>
    </div>

    <!-- Filter -->
    <div class="po-filter" style="margin-bottom:1rem;">
      <button class="filter-btn filter-btn-2 active" data-filter="all" data-i18n="expiry.filterAll">All</button>
      <button class="filter-btn filter-btn-2" data-filter="expired" data-i18n="expiry.filterExpired">Expired</button>
      <button class="filter-btn filter-btn-2" data-filter="30" data-i18n="expiry.filter30">Ã¢â€°Â¤ 30 days</button>
      <button class="filter-btn filter-btn-2" data-filter="90" data-i18n="expiry.filter90">31-90 days</button>
      <button class="filter-btn filter-btn-2" data-filter="ok" data-i18n="expiry.filterOk">OK</button>
      <input type="text" id="expiry-search" data-i18n="expiry.searchPlaceholder" placeholder="Search by name or barcode..." style="flex:1; padding:0.5rem 0.8rem; border:1px solid #d8d8d8; border-radius:6px; margin-left:auto;">
    </div>

    <table class="product-table">
      <thead>
        <tr>
          <th data-i18n="expiry.thName">Name</th>
          <th data-i18n="expiry.thCategory">Category</th>
          <th data-i18n="expiry.thBarcode">Barcode</th>
          <th data-i18n="expiry.thQty">Qty</th>
          <th data-i18n="expiry.thExpiryDate">Expiry date</th>
          <th data-i18n="expiry.thDaysLeft">Days left</th>
          <th data-i18n="expiry.thStatus">Status</th>
        </tr>
      </thead>
      <tbody id="expiry-list">
        <!-- Rows are inserted here by JavaScript -->
      </tbody>
    </table>
    <div id="expiry-pagination" class="pagination-bar" hidden>
      <span id="expiry-page-info" class="page-info"></span>
      <div class="pagination-actions">
        <button type="button" id="expiry-page-prev" class="btn btn-outline btn-sm" data-i18n="expiry.prevPage">Previous</button>
        <span id="expiry-page-num" class="page-num"></span>
        <button type="button" id="expiry-page-next" class="btn btn-outline btn-sm" data-i18n="expiry.nextPage">Next</button>
      </div>
    </div>
  </main>

  <script src="i18n.js"></script>
  <script src="expiry.js"></script>
  


  <script src="auth.js"></script>
  <script src="branding.js"></script>
  <script src="support.js"></script>
  <script src="sidebar.js"></script>
  <script src="theme.js"></script>
</body>
</html>
