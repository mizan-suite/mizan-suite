<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mizan Suite - Staff</title>
  <script>try{var t=localStorage.getItem('mizan_theme');document.documentElement.setAttribute('data-theme',t||'blue');var d=localStorage.getItem('mizan_dark');if(d==='true')document.documentElement.classList.add('dark-mode');var l=localStorage.getItem('mizan_lang');if(l==='ar'||l==='fr'){document.documentElement.lang=l;}if(l==='ar')document.documentElement.dir='rtl';}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dark-mode.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="rtl.css">
</head>
<body data-i18n-title="staff.title">

  <div id="app-sidebar"></div>

  <main class="container">
    <div class="dashboard-header-row">
      <h1 data-i18n="staff.title">Staff</h1>
    </div>

    <!-- Add / edit worker -->
    <form id="staff-form" class="product-form">
      <h2 id="staff-form-title" data-i18n="staff.addWorker">Add Worker</h2>
      <div class="form-grid">
        <input type="text" id="staff-name" data-i18n="staff.name" placeholder="Name">
        <input type="text" id="staff-pin" data-i18n="staff.pin" placeholder="PIN (login)" inputmode="numeric" maxlength="6">
        <input type="text" id="staff-job" data-i18n="staff.jobTitle" placeholder="Job title">
        <input type="text" id="staff-phone" data-i18n="staff.phone" placeholder="Phone">
        <input type="date" id="staff-hire" data-i18n="staff.hireDate">
        <input type="number" id="staff-hourly" data-i18n="staff.thHourly" placeholder="Hourly (DA/h)" step="0.01" min="0">
        <input type="number" id="staff-monthly" data-i18n="staff.thMonthly" placeholder="Monthly (DA)" step="0.01" min="0">
        <input type="time" id="staff-shift-start" data-i18n="staff.shiftStart" title="Expected shift start">
        <input type="time" id="staff-shift-end" data-i18n="staff.shiftEnd" title="Expected shift end">
        <label style="display:flex; align-items:center; gap:0.5rem; white-space:nowrap;">
          <input type="checkbox" id="staff-active" checked>
          <span data-i18n="staff.active">Active</span>
        </label>
        <span class="hint-text" data-i18n="staff.pinHint">Leave blank to auto-generate</span>
      </div>
      <div style="display:flex; gap:0.5rem;">
        <button type="submit" class="btn" id="staff-submit" data-i18n="staff.addWorker">Add Worker</button>
        <button type="button" class="btn btn-ghost" id="staff-cancel" data-i18n="staff.cancel" style="display:none;">Cancel</button>
      </div>
    </form>

    <!-- Staff list -->
    <div id="staff-list"></div>
  </main>

  <script src="i18n.js"></script>
  <script src="staff.js"></script>
  <script src="auth.js"></script>
  <script src="branding.js"></script>
  <script src="support.js"></script>
  <script src="sidebar.js"></script>
  <script src="theme.js"></script>
</body>
</html>
