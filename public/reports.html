<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mizan Suite - Reports</title>
  <script>try{var t=localStorage.getItem('mizan_theme');document.documentElement.setAttribute('data-theme',t||'blue');var d=localStorage.getItem('mizan_dark');if(d==='true')document.documentElement.classList.add('dark-mode');var l=localStorage.getItem('mizan_lang');if(l==='ar'||l==='fr'){document.documentElement.lang=l;}if(l==='ar')document.documentElement.dir='rtl';}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dark-mode.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="rtl.css">
</head>
<body data-i18n-title="reports.title">

  <div id="app-sidebar"></div>

  <main class="container">
    <h1 data-i18n="reports.title">Reports</h1>

    <div class="product-form">
      <div class="form-grid">
        <select id="report-type">
          <option value="sales" data-i18n="reports.sales">Sales</option>
          <option value="products" data-i18n="reports.products">Products / Inventory</option>
          <option value="expenses" data-i18n="reports.expenses">Expenses</option>
          <option value="profit" data-i18n="reports.profit">Profit &amp; Loss (by month)</option>
        </select>
        <input type="date" id="report-from" data-i18n="reports.from" placeholder="From date">
        <input type="date" id="report-to" data-i18n="reports.to" placeholder="To date">
      </div>
      <p class="hint-text" data-i18n="reports.hint">Date range applies to Sales and Expenses reports only.</p>
      <button id="generate-btn" class="btn" data-i18n="reports.generate">Generate Report</button>

      <div style="margin-top:1rem; display:flex; gap:0.6rem; flex-wrap:wrap; align-items:center;">
        <button id="export-csv-btn" class="btn btn-outline btn-sm" data-i18n="reports.exportCsv">Export CSV</button>
        <button id="export-excel-btn" class="btn btn-outline btn-sm" data-i18n="reports.exportExcel">Export Excel</button>
        <button id="export-pdf-btn" class="btn btn-outline btn-sm" data-i18n="reports.exportPdf">Export PDF</button>
      </div>
    </div>

    <div id="report-output"></div>
    <div id="report-pagination" class="pagination-bar" hidden>
      <span id="report-page-info" class="page-info"></span>
      <div class="pagination-actions">
        <button type="button" id="report-page-prev" class="btn btn-outline btn-sm" data-i18n="reports.prevPage">Previous</button>
        <span id="report-page-num" class="page-num"></span>
        <button type="button" id="report-page-next" class="btn btn-outline btn-sm" data-i18n="reports.nextPage">Next</button>
      </div>
    </div>
  </main>

  <script src="i18n.js"></script>
  <script src="reports.js"></script>
  


  <script src="auth.js"></script>
  <script src="branding.js"></script>
  <script src="support.js"></script>
  <script src="sidebar.js"></script>
  <script src="theme.js"></script>
</body>
</html>
