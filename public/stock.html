<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mizan Suite - Stock Management</title>
  <script>try{var t=localStorage.getItem('mizan_theme');document.documentElement.setAttribute('data-theme',t||'blue');var d=localStorage.getItem('mizan_dark');if(d==='true')document.documentElement.classList.add('dark-mode');var l=localStorage.getItem('mizan_lang');if(l==='ar'||l==='fr'){document.documentElement.lang=l;}if(l==='ar')document.documentElement.dir='rtl';}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dark-mode.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="rtl.css">
</head>
<body data-i18n-title="stock.title">

  <div id="app-sidebar"></div>

  <main class="container">
    <h1 id="page-title" data-i18n="stock.title">Stock Management</h1>

    <!-- Product selector (in case no id was passed in the URL) -->
    <div class="product-form">
      <h2 data-i18n="stock.selectProduct">Select Product</h2>
      <select id="product-select">
        <option value="" data-i18n="stock.allProducts">All products (history only)</option>
      </select>
    </div>

    <!-- Movement form -->
    <div class="product-form">
      <h2 data-i18n="stock.recordChange">Record a Stock Change</h2>
      <div class="form-grid">
        <select id="movement-type">
          <option value="incoming" data-i18n="stock.incoming">Incoming stock (restock)</option>
          <option value="return" data-i18n="stock.return">Customer return</option>
          <option value="damage" data-i18n="stock.damage">Damage / loss (remove stock)</option>
          <option value="adjustment" data-i18n="stock.adjustment">Manual adjustment (set exact count)</option>
        </select>
        <input type="number" id="movement-quantity" data-i18n="stock.quantityPlaceholder" placeholder="Quantity" min="0">
        <input type="text" id="movement-reason" data-i18n="stock.reasonPlaceholder" placeholder="Reason / note (optional)">
      </div>
      <p class="hint-text" id="movement-hint"></p>
      <button id="submit-movement" class="btn" data-i18n="stock.record">Record</button>
      <p id="movement-message"></p>
    </div>

    <!-- History -->
    <h2 data-i18n="stock.history">Stock History</h2>
    <table class="product-table">
      <thead>
        <tr>
          <th data-i18n="stock.thDate">Date</th>
          <th data-i18n="stock.thProduct">Product</th>
          <th data-i18n="stock.thType">Type</th>
          <th data-i18n="stock.thChange">Change</th>
          <th data-i18n="stock.thReason">Reason</th>
        </tr>
      </thead>
      <tbody id="history-list"></tbody>
    </table>
    <div id="history-pagination" class="pagination-bar" hidden>
      <span id="history-page-info" class="page-info"></span>
      <div class="pagination-actions">
        <button type="button" id="history-page-prev" class="btn btn-outline btn-sm" data-i18n="stock.prevPage">Previous</button>
        <span id="history-page-num" class="page-num"></span>
        <button type="button" id="history-page-next" class="btn btn-outline btn-sm" data-i18n="stock.nextPage">Next</button>
      </div>
    </div>
  </main>

  <script src="i18n.js"></script>
  <script src="stock.js"></script>
  


  <script src="auth.js"></script>
  <script src="branding.js"></script>
  <script src="support.js"></script>
  <script src="sidebar.js"></script>
  <script src="theme.js"></script>
</body>
</html>
