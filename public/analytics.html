<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mizan Suite - Analytics</title>
  <script>try{var t=localStorage.getItem('mizan_theme');if(t)document.documentElement.setAttribute('data-theme',t);var d=localStorage.getItem('mizan_dark');if(d==='true')document.documentElement.classList.add('dark-mode');var l=localStorage.getItem('mizan_lang');if(l==='ar'||l==='fr'){document.documentElement.lang=l;}if(l==='ar')document.documentElement.dir='rtl';}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dark-mode.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="rtl.css">
  <script src="vendor/chart.min.js"></script>
</head>
<body data-i18n-title="analytics.title">

  <div id="app-sidebar"></div>

  <main class="container">
    <h1 data-i18n="analytics.title">Analytics</h1>

    <!-- Period filter -->
    <div class="po-filter">
      <button class="filter-btn active" data-period="" data-i18n="analytics.allTime">All time</button>
      <button class="filter-btn" data-period="month" data-i18n="analytics.thisMonth2">This month</button>
      <button class="filter-btn" data-period="year" data-i18n="analytics.thisYear2">This year</button>
      <button class="filter-btn" data-period="custom" data-i18n="financial.custom">Custom</button>
    </div>
    <div class="po-filter" id="custom-range" style="display:none;">
      <input type="date" id="custom-from" class="date-range-input" data-i18n="financial.from" data-i18n-title="financial.from" title="From date">
      <span class="date-range-sep">Ã¢â€ â€™</span>
      <input type="date" id="custom-to" class="date-range-input" data-i18n="financial.to" data-i18n-title="financial.to" title="To date">
      <button class="btn btn-sm" id="apply-custom-btn" data-i18n="financial.apply">Apply</button>
    </div>

    <!-- Avg purchase value / items per sale -->
    <div class="stat-grid">
      <div class="stat-card">
        <span class="stat-label" data-i18n="analytics.avgPurchase">Average Purchase Value</span>
        <span class="stat-value" id="avg-purchase">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label" data-i18n="analytics.avgItems">Average Items per Sale</span>
        <span class="stat-value" id="avg-items">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label" data-i18n="analytics.totalSales">Total Sales Recorded</span>
        <span class="stat-value" id="total-sales-count">-</span>
      </div>
    </div>

    <!-- Monthly / yearly comparison -->
    <div class="panel-grid">
      <div class="panel">
        <h2 data-i18n="analytics.monthCompare">This Month vs Last Month</h2>
        <canvas id="monthly-chart"></canvas>
      </div>
      <div class="panel">
        <h2 data-i18n="analytics.yearCompare">This Year vs Last Year</h2>
        <canvas id="yearly-chart"></canvas>
      </div>
    </div>

    <!-- Sales by category -->
    <div class="chart-card panel-wide" style="margin-top: 1.5rem;">
      <h2 data-i18n="analytics.salesByCategory">Sales by Category</h2>
      <canvas id="category-chart"></canvas>
    </div>

    <!-- Top / worst sellers -->
    <div class="panel-grid" style="margin-top: 1.5rem;">
      <div class="panel">
        <h2 data-i18n="analytics.topSellers">Top-Selling Products</h2>
        <ul id="top-sellers" class="simple-list"></ul>
        <div id="top-pagination" class="pagination-bar" hidden>
          <span id="top-page-info" class="page-info"></span>
          <div class="pagination-actions">
            <button type="button" id="top-page-prev" class="btn btn-outline btn-sm" data-i18n="analytics.prevPage">Previous</button>
            <span id="top-page-num" class="page-num"></span>
            <button type="button" id="top-page-next" class="btn btn-outline btn-sm" data-i18n="analytics.nextPage">Next</button>
          </div>
        </div>
      </div>
      <div class="panel">
        <h2 data-i18n="analytics.worstSellers">Worst-Selling Products</h2>
        <ul id="worst-sellers" class="simple-list"></ul>
        <div id="worst-pagination" class="pagination-bar" hidden>
          <span id="worst-page-info" class="page-info"></span>
          <div class="pagination-actions">
            <button type="button" id="worst-page-prev" class="btn btn-outline btn-sm" data-i18n="analytics.prevPage">Previous</button>
            <span id="worst-page-num" class="page-num"></span>
            <button type="button" id="worst-page-next" class="btn btn-outline btn-sm" data-i18n="analytics.nextPage">Next</button>
          </div>
        </div>
      </div>
      <div class="panel panel-wide">
        <h2 data-i18n="analytics.neverSold">Products Never Sold</h2>
        <ul id="never-sold" class="simple-list"></ul>
        <div id="never-pagination" class="pagination-bar" hidden>
          <span id="never-page-info" class="page-info"></span>
          <div class="pagination-actions">
            <button type="button" id="never-page-prev" class="btn btn-outline btn-sm" data-i18n="analytics.prevPage">Previous</button>
            <span id="never-page-num" class="page-num"></span>
            <button type="button" id="never-page-next" class="btn btn-outline btn-sm" data-i18n="analytics.nextPage">Next</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="i18n.js"></script>
  <script src="analytics.js"></script>
  


  <script src="auth.js"></script>
  <script src="branding.js"></script>
  <script src="support.js"></script>
  <script src="sidebar.js"></script>
  <script src="theme.js"></script>
</body>
</html>
