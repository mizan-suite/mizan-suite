<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mizan Suite - Refunds & Exchanges</title>
  <script>try{var t=localStorage.getItem('mizan_theme');if(t)document.documentElement.setAttribute('data-theme',t);var d=localStorage.getItem('mizan_dark');if(d==='true')document.documentElement.classList.add('dark-mode');var l=localStorage.getItem('mizan_lang');if(l==='ar'||l==='fr'){document.documentElement.lang=l;}if(l==='ar')document.documentElement.dir='rtl';}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dark-mode.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="rtl.css">
</head>
<body data-i18n-title="refunds.title">

  <div id="app-sidebar"></div>

  <main class="container">
    <h1 data-i18n="refunds.title">Refunds &amp; Exchanges</h1>

    <div class="product-form">
      <h2 data-i18n="refunds.findSale">Find a Sale</h2>
      <div class="form-grid">
        <input type="number" id="sale-id-input" data-i18n="refunds.saleNumber" placeholder="Sale # (see Dashboard > Recent Transactions)">
      </div>
      <button id="find-sale-btn" class="btn" data-i18n="refunds.findSaleBtn">Find Sale</button>
    </div>

    <div id="sale-detail"></div>
  </main>

  <script src="i18n.js"></script>
  <script src="refunds.js"></script>
  


  <script src="auth.js"></script>
  <script src="branding.js"></script>
  <script src="support.js"></script>
  <script src="sidebar.js"></script>
  <script src="theme.js"></script>
</body>
</html>
